[project]
name = "acms-ai"
version = "0.1.0"
description = "AI Comment Moderation - AI package: queue worker (BullMQ) + offline LoRA training"
requires-python = ">=3.12"
dependencies = [
  "bullmq>=3.6",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "acms_ai"
