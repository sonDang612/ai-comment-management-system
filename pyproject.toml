# uv workspace root (virtual: not a package itself).
# Members share one lockfile (uv.lock) and one virtualenv (.venv).
[tool.uv.workspace]
members = ["apps/ai"]

[dependency-groups]
dev = [
  "httpx>=0.28",
  "pytest>=8.3",
  "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["acms_ai"]

# `uv run pytest` from the repo root runs the Python suite (as does `npm run test`).
[tool.pytest.ini_options]
testpaths = ["apps/ai/tests"]
addopts = "-ra --import-mode=importlib"
