# LoRA fine-tuning of Qwen3-1.7B for comment moderation.
# Relative paths resolve from the current directory: run every command from apps/ai.
# Any value can also be overridden on the command line (see training/README.md).

[model]
# Hugging Face model id, or a local directory that holds the downloaded base model.
base_model = "Qwen/Qwen3-1.7B"
# Pin a commit hash for reproducible runs.
# revision = "main"
# cache_dir = "training/models/hf-cache"
local_files_only = false
# auto = bf16 on GPUs that support it, fp16 on other CUDA GPUs, fp32 on CPU.
precision = "auto"
# QLoRA: loads the frozen base model in 4-bit NF4 (needs bitsandbytes and a CUDA GPU).
load_in_4bit = false
attn_implementation = "sdpa"

[lora]
rank = 16
alpha = 32
dropout = 0.05
target_modules = ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
bias = "none"

[training]
output_dir = "training/outputs/qwen3-1.7b-lora-v1"
batch_size = 4
gradient_accumulation_steps = 4
learning_rate = 2e-4
epochs = 3
max_seq_length = 512
# Tokens kept free for the JSON answer; longer comments are truncated to fit.
completion_reserve_tokens = 96
warmup_ratio = 0.05
weight_decay = 0.0
lr_scheduler = "cosine"
max_grad_norm = 1.0
logging_steps = 10
eval_steps = 100
save_total_limit = 2
early_stopping_patience = 3
gradient_checkpointing = true
seed = 42

[data]
split_dir = "training/data/splits/v1"

[evaluation]
batch_size = 8
# Threshold tuning on the validation split: the lowest threshold whose precision reaches the target.
valid_target_precision = 0.95
invalid_target_precision = 0.97
# Used when no threshold reaches its target (docs 5.1.4 defaults).
default_valid_threshold = 0.85
default_invalid_threshold = 0.90
min_accepted = 20
threshold_grid_min = 0.50
threshold_grid_step = 0.01
# Acceptance targets from docs 5.4.
question_target_precision = 0.90
question_target_recall = 0.90
max_uncertain_rate = 0.15
